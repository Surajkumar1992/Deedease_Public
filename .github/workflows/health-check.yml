name: Public Site Health Check

# Light checks every 30 min (no Web3Forms quota used). A real form submission
# through a browser runs twice a day (~60/month of the 250 Web3Forms quota).
# Any scheduled failure opens an issue and emails the owner.
on:
  schedule:
    - cron: '*/30 * * * *'
    - cron: '17 4,16 * * *'
  workflow_dispatch:
    inputs:
      run_form_test:
        description: 'Also submit a REAL test form (uses 1 Web3Forms email)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

env:
  SITE_URL: https://deedease.com
  FORM_ENDPOINT: https://api.web3forms.com/submit

jobs:
  health:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '*/30 * * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check site pages and assets
        run: |
          set -u
          fail=0
          for path in / /main.js /styles.css /privacy.html; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 --retry 2 --retry-delay 3 "$SITE_URL$path" || echo 000)
            echo "$path -> $code"
            [ "$code" = "200" ] || { echo "::error::$path returned $code"; fail=1; }
          done
          curl -sf --max-time 20 "$SITE_URL/" -o index.html || fail=1
          for marker in 'data-form="waitlist"' 'data-form="lead"' 'main.js'; do
            grep -q "$marker" index.html || { echo "::error::Home page missing '$marker'"; fail=1; }
          done
          exit $fail

      - name: Check live Web3Forms access key and API
        run: |
          set -u
          curl -sf --max-time 20 "$SITE_URL/main.js" -o main.js
          key=$(grep -oE "WEB3FORMS_ACCESS_KEY *= *'[^']*'" main.js | head -1 | sed -E "s/.*'([^']*)'/\1/")
          endpoint=$(grep -oE "FORM_ENDPOINT *= *'[^']*'" main.js | head -1 | sed -E "s/.*'([^']*)'/\1/")
          if ! echo "$key" | grep -qE '^[0-9a-fA-F-]{36}$'; then
            echo "::error::Live main.js has no valid Web3Forms access key (found: '$key')"; exit 1
          fi
          [ "$endpoint" = "$FORM_ENDPOINT" ] || { echo "::error::Unexpected form endpoint '$endpoint'"; exit 1; }

          # Key-only request: Web3Forms validates the key first and rejects the
          # payload for lacking fields, so nothing is emailed.
          resp=$(curl -s --max-time 20 --retry 2 --retry-delay 3 -w '\n%{http_code}' -X POST "$FORM_ENDPOINT" \
            -H 'Content-Type: application/json' -H 'Accept: application/json' \
            -H "Origin: $SITE_URL" -d "{\"access_key\":\"$key\"}")
          code=${resp##*$'\n'}; body=${resp%$'\n'*}
          echo "HTTP $code: $body"
          # Free plan blocks server-side calls (GitHub runner IPs) with this 403.
          # It still proves the API is up, but the key can't be validated from here.
          if [ "$code" = "403" ] && echo "$body" | grep -qi 'method is not allowed'; then
            echo "::warning::Web3Forms is reachable but blocks server-side calls; key not validated (format and endpoint checked only)."
            exit 0
          fi
          if [ "$code" -ge 500 ] || [ "$code" = "000" ] || [ "$code" = "403" ] || [ "$code" = "429" ]; then
            echo "::error::Web3Forms API unhealthy (HTTP $code)"; exit 1
          fi
          if echo "$body" | grep -qiE 'invalid|disabled|expired|limit|suspend|not found|verify'; then
            echo "::error::Web3Forms rejected the access key: $body"; exit 1
          fi
          echo "Web3Forms API reachable and access key accepted."

  form-e2e:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_form_test) || github.event.schedule == '17 4,16 * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright (uses the runner's Chrome)
        run: npm install --no-save --no-package-lock playwright-core
      - name: Submit waitlist form in a real browser
        run: node .github/scripts/form-e2e.mjs

  notify:
    needs: [health, form-e2e]
    if: ${{ always() && (needs.health.result == 'failure' || needs.form-e2e.result == 'failure') && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - name: Open or update incident issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search 'Site health check failing in:title' --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" -R "$GITHUB_REPOSITORY" --body "Still failing: $RUN_URL"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "Site health check failing" \
              --body "The public site or Web3Forms health check failed: $RUN_URL"
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      # Emails only when an incident starts, not on every 30-minute re-run.
      - name: Email alert
        if: steps.issue.outputs.new == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.titan.email
          server_port: 465
          secure: true
          username: ${{ secrets.ALERT_SMTP_USERNAME }}
          password: ${{ secrets.ALERT_SMTP_PASSWORD }}
          from: Deedease Health Check <support@deedease.com>
          to: suraj.subham@gmail.com
          subject: "ALERT: deedease.com site / form health check failed"
          body: |
            The deedease.com health check failed. Visitors may be unable to submit forms.
            Run details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
